<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Country App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="search-wrapper">

        
            <input type="text" id="country-input" placeholder="Enter country name" required>
            <button type="submit" id="search">Search</button>

        </div>
        <div id="search-result">

            <img src="" id="flag">
            <h2> Country:  <span id="name"></span></h2>
            <h4 id="aa"> Capital: <span id="Capital"></span></h4>
            <h4> Continent: <span id="Continent"></span></h4>
            <h4> Population: <span id="Population"></span></h4>
            <h4> Currency: <span id="Currency"></span> -<span id="CurrencyShort"></span></h4>
            <h4> Language: <span id="Language"></span></h4>
        </div>
    </div>

    <script src="script.js"></script>
    
  
</body>
</html>
